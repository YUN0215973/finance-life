<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素理財人生</title>
<meta name="description" content="像素理財人生：從高三畢業開始的十年。投資達人課程期末複習遊戲。">
<!-- 字型：俐方體 11 號（Cubic 11），繁體中文像素字型，SIL OFL 1.1 授權 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@4c566f7d6cc5c05ee360fe9cff56b5da1fcafd4d/fonts/web/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== 字型 ===== */
@font-face{
  font-family:'Cubic11';
  src:url('Cubic_11.woff2') format('woff2'),            /* 若把字型檔一起上傳到 GitHub，會優先用這個 */
      url('https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@4c566f7d6cc5c05ee360fe9cff56b5da1fcafd4d/fonts/web/Cubic_11.woff2') format('woff2');
  font-display:swap;
}
/* ===== PICO-8 調色盤 ===== */
:root{
  --black:#000000; --navy:#1D2B53; --plum:#7E2553; --dgreen:#008751;
  --brown:#AB5236; --dgray:#5F574F; --lgray:#C2C3C7; --white:#FFF1E8;
  --red:#FF004D; --orange:#FFA300; --yellow:#FFEC27; --green:#00E436;
  --blue:#29ADFF; --lav:#83769C; --pink:#FF77A8; --peach:#FFCCAA;
  --px:4px;
  --font:'Cubic11','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--navy);
  background-image:
    linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),
    linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);
  background-size:24px 24px;
  color:var(--white);
  font-family:var(--font);
  font-size:17px; line-height:1.7; letter-spacing:.5px;
}
.pf{font-family:var(--font);letter-spacing:2px}
.num,.pct,.big-num{font-family:var(--font);letter-spacing:.5px;font-variant-numeric:tabular-nums}
#app{max-width:860px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none!important}

/* 像素階梯邊框（不用圓角、不用漸層） */
.box{
  background:var(--white);color:var(--black);
  padding:18px 20px;margin:14px var(--px);position:relative;
  box-shadow:
    0 calc(var(--px)*-1) 0 0 var(--black),
    0 var(--px) 0 0 var(--black),
    calc(var(--px)*-1) 0 0 0 var(--black),
    var(--px) 0 0 0 var(--black),
    0 calc(var(--px)*2) 0 0 rgba(0,0,0,.45),
    var(--px) var(--px) 0 0 rgba(0,0,0,.45);
}
.box.dark{background:#10183a;color:var(--white)}
.box h2{font-size:22px;margin-bottom:8px;letter-spacing:1px}
.box h3{font-size:17px;margin:12px 0 4px}

/* 按鈕：按下往下 2 像素 */
.btn{
  font-family:var(--font);font-size:17px;
  background:var(--orange);color:var(--black);border:none;cursor:pointer;
  padding:10px 18px;margin:6px var(--px);position:relative;
  box-shadow:
    0 -4px 0 0 var(--black),0 4px 0 0 var(--black),
    -4px 0 0 0 var(--black),4px 0 0 0 var(--black),
    inset -4px -4px 0 0 rgba(0,0,0,.25),inset 4px 4px 0 0 rgba(255,255,255,.35);
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);box-shadow:0 -4px 0 0 var(--black),0 4px 0 0 var(--black),-4px 0 0 0 var(--black),4px 0 0 0 var(--black),inset 4px 4px 0 0 rgba(0,0,0,.25)}
.btn:focus-visible{outline:3px dashed var(--yellow);outline-offset:6px}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.red{background:var(--red);color:var(--white)}
.btn.gray{background:var(--lgray)}
.btn.pink{background:var(--pink)}
.btn.opt.right{background:var(--green)!important;color:#000}
.btn.opt.wrong{background:var(--red)!important;color:#fff}
.btn.opt[disabled]{cursor:default}
.btn.small{font-size:14px;padding:5px 10px}
.btn[disabled]{background:var(--dgray);color:var(--lgray);cursor:not-allowed;filter:none}
.btn[disabled]:active{transform:none}
.btn.big{font-size:20px;padding:14px 26px;min-width:240px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.center{text-align:center}
.mt{margin-top:12px}
.muted{color:var(--dgray);font-size:14px}
.box.dark .muted{color:var(--lgray)}

/* 動畫 */
.screen{animation:pop .25s steps(4)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:perspective(600px) rotateY(0)}}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(110vh)}}
.blink{animation:blink 1s steps(1) infinite}

/* 標題 */
.title-logo{font-size:44px;letter-spacing:4px;line-height:1.35;color:var(--yellow);text-shadow:4px 4px 0 var(--plum),8px 8px 0 var(--black);margin:28px 0 8px}
.title-sub{font-size:14px;letter-spacing:6px;color:var(--peach);margin-bottom:18px}
.title-chars{display:flex;justify-content:center;gap:24px;margin:16px 0}
.title-chars canvas{animation:bob 1.2s steps(2) infinite}
.title-chars canvas:nth-child(2){animation-delay:.6s}
.menu-col{display:flex;flex-direction:column;align-items:center;gap:8px}
.coins{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.coin{position:absolute;top:0;width:12px;height:12px;background:var(--yellow);box-shadow:inset -3px -3px 0 var(--orange),0 0 0 2px #000;animation:fall linear infinite}
.burst{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.burst .coin{animation:fall 1.4s steps(14) forwards}

/* 狀態列 */
.hud{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#10183a;padding:8px 12px;margin:8px var(--px) 4px;box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000;position:sticky;top:4px;z-index:20}
.hud .who{display:flex;align-items:center;gap:8px;font-size:16px}
.hud .stat{font-size:14px;white-space:nowrap}
.hud .stat b{color:var(--yellow);font-weight:normal}
.hud .stat b.neg{color:var(--red)}
.hud .spacer{flex:1}
.hbar{display:inline-block;width:70px;height:12px;background:var(--dgray);vertical-align:middle;box-shadow:0 0 0 2px #000}
.hbar i{display:block;height:100%;background:var(--pink)}
.saved{position:fixed;right:16px;top:16px;background:var(--green);color:#000;padding:6px 12px;z-index:90;box-shadow:0 0 0 3px #000;animation:blink .3s steps(1) 3}

/* 景氣燈號：像素圓燈 */
.lamps{display:flex;gap:8px;align-items:center}
.lamp{width:30px;height:30px;clip-path:polygon(30% 0,70% 0,70% 10%,90% 10%,90% 30%,100% 30%,100% 70%,90% 70%,90% 90%,70% 90%,70% 100%,30% 100%,30% 90%,10% 90%,10% 70%,0 70%,0 30%,10% 30%,10% 10%,30% 10%);opacity:.22}
.lamp.on{opacity:1;animation:blink 1s steps(1) infinite;width:44px;height:44px}
.lamp-label{font-size:12px;text-align:center}
.lampcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.light{display:inline-block;width:16px;height:16px;vertical-align:-2px;box-shadow:0 0 0 2px #000;margin-right:6px}
.paper{background:#f4e9d2;color:#222}
.paper .mast{font-family:var(--font);font-size:15px;letter-spacing:1px;border-bottom:4px double #222;padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.headline{font-size:22px;line-height:1.4;margin:6px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.kv div{background:rgba(0,0,0,.06);padding:6px 10px}
.box.dark .kv div{background:rgba(255,255,255,.07)}
.kv b{display:block;font-size:20px;font-weight:normal}

/* 名詞：虛線底線＋問號 */
.term{color:var(--plum);border-bottom:2px dashed var(--plum);cursor:help;font-weight:bold;white-space:nowrap}
.term::after{content:'?';display:inline-block;font-size:10px;line-height:13px;width:13px;height:13px;text-align:center;background:var(--plum);color:var(--white);margin-left:2px;vertical-align:2px;font-family:var(--font)}
.box.dark .term,.hud .term{color:var(--pink);border-color:var(--pink)}
.box.dark .term::after{background:var(--pink);color:#000}
.wk{display:inline-block;font-size:11px;background:var(--navy);color:var(--yellow);padding:0 6px;margin-left:4px;vertical-align:middle;white-space:nowrap}

/* 滑桿 */
.slider{display:grid;grid-template-columns:120px 1fr 60px 110px;align-items:center;gap:10px;margin:12px 0}
.slider label{font-size:16px}
.slider .pct{text-align:right}
.slider .amt{font-size:14px;text-align:right;color:var(--dgray)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:var(--lgray);box-shadow:0 0 0 3px #000;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:30px;background:var(--c,var(--orange));box-shadow:0 0 0 3px #000,inset -4px -4px 0 rgba(0,0,0,.3);border:none;border-radius:0}
input[type=range]::-moz-range-thumb{width:24px;height:30px;background:var(--c,var(--orange));box-shadow:0 0 0 3px #000;border:none;border-radius:0}
input[type=range]:focus-visible{outline:3px dashed var(--plum);outline-offset:4px}
.remain{font-size:18px;padding:8px 12px;display:inline-block;background:var(--green);box-shadow:0 0 0 3px #000}
.remain.bad{background:var(--red);color:var(--white)}
.remain.shake{animation:shake .2s steps(2) 2}
.alloc-bar{display:flex;height:22px;box-shadow:0 0 0 3px #000;margin:10px 0;background:var(--lgray)}
.alloc-bar span{display:block;height:100%}

/* 表格 */
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:5px 8px;border-bottom:2px dashed rgba(0,0,0,.2);text-align:left;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.pos{color:var(--dgreen)} .neg{color:var(--red)}
.box.dark .pos{color:var(--green)}
.box.dark td,.box.dark th{border-color:rgba(255,255,255,.18)}
.sw{display:inline-block;width:12px;height:12px;box-shadow:0 0 0 2px #000;margin-right:6px;vertical-align:-1px}

/* 事件卡、抉擇卡（翻牌） */
.card{background:var(--peach);padding:14px 16px;margin:14px 4px;box-shadow:0 0 0 4px #000,6px 6px 0 4px rgba(0,0,0,.35);animation:flip .5s steps(5)}
.card .ct{font-size:18px;font-weight:bold;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .icon{font-size:28px;line-height:1}
.card.choice{background:var(--yellow)}
.card .lesson{margin-top:6px;font-size:14px;background:rgba(0,0,0,.08);padding:4px 8px}

/* 選項 */
.opt{display:block;width:calc(100% - 8px);text-align:left;margin:12px 4px}
.quiz-q{font-size:20px;margin:8px 0 12px}
.progress{display:flex;gap:6px;margin:8px 0 14px}
.progress i{flex:1;height:14px;background:var(--lgray);box-shadow:0 0 0 3px #000}
.progress i.done{background:var(--green)}

/* 角色 */
canvas.sprite{image-rendering:pixelated;image-rendering:crisp-edges}
.gender-pick{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.gcard,.mcard{background:var(--white);padding:12px 16px;cursor:pointer;text-align:center;box-shadow:0 0 0 4px #000;border:none;font-family:inherit;font-size:17px;color:#000}
.mcard{width:min(260px,100%);line-height:1.5}.mcard .micon{font-size:30px}
.gcard.sel,.mcard.sel{background:var(--yellow);box-shadow:0 0 0 4px #000,0 0 0 8px var(--orange)}
.gcard.sel canvas{animation:bob .8s steps(2) infinite}
.name-input{font-family:var(--font);font-size:22px;padding:8px 12px;width:min(320px,100%);border:none;box-shadow:0 0 0 4px #000;background:#fff;outline:none;margin:4px}
.name-input:focus{box-shadow:0 0 0 4px #000,0 0 0 8px var(--blue)}
.err{color:var(--red);font-size:15px;min-height:24px}

/* 圖表 */
.chart-cv{width:100%;height:270px;display:block;background:#10183a;box-shadow:0 0 0 4px #000}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:12px}
.legend i{display:inline-block;width:14px;height:14px;margin-right:4px;vertical-align:-2px;box-shadow:0 0 0 2px #000}

/* 結局 */
.grade{font-family:var(--font);font-size:110px;line-height:1;text-shadow:6px 6px 0 #000;animation:bob 1s steps(2) infinite;display:inline-block}
.g-S{color:var(--yellow)} .g-A{color:var(--green)} .g-B{color:var(--blue)} .g-C{color:var(--orange)} .g-D{color:var(--red)}
.comment{background:var(--white);color:#000;padding:10px 14px;margin:12px 4px;box-shadow:0 0 0 3px #000;border-left:10px solid var(--orange)}

/* 存檔欄 */
.slot{display:flex;align-items:center;gap:12px;background:var(--white);color:#000;padding:10px 12px;margin:14px 4px;box-shadow:0 0 0 4px #000;flex-wrap:wrap}
.slot .info{flex:1;min-width:160px}
.slot.empty{background:var(--lgray);color:var(--dgray)}
.tag{display:inline-block;font-size:12px;padding:0 6px;background:var(--green);color:#000;margin-left:6px;box-shadow:0 0 0 2px #000}
textarea{width:100%;font-family:monospace;font-size:13px;padding:8px;border:none;box-shadow:0 0 0 3px #000;min-height:80px;resize:vertical;margin:4px 0}

/* 彈窗、提示 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{max-width:560px;width:100%;max-height:88vh;overflow:auto;animation:pop .2s steps(3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:var(--yellow);padding:10px 18px;box-shadow:0 0 0 4px var(--yellow);z-index:95;font-size:16px;max-width:90vw;text-align:center}
.tip{position:absolute;z-index:99;max-width:300px;background:var(--black);color:var(--white);padding:10px 12px;font-size:15px;box-shadow:0 0 0 3px var(--yellow),6px 6px 0 3px rgba(0,0,0,.4)}
.tip b{color:var(--yellow)}
.tip .ex{margin-top:6px;color:var(--peach)}
.rank-table td,.rank-table th{font-size:14px;vertical-align:middle}
.rank-1 td{background:rgba(255,236,39,.35)}
.delta{font-size:12px;margin-left:4px}
/* v0.7：場景、燈號變化、快問快答、人生目標、徽章 */
.scene-wrap{position:relative;margin:14px 4px 0}
.scene{display:block;width:100%;margin:0;aspect-ratio:128/40;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 4px #000;background:#83769C}
.scene-hint{font-size:13px;color:var(--lgray);text-align:right;margin:8px 6px -4px}
.say{position:absolute;top:8px;transform:translateX(-50%);background:var(--white);color:#000;font-size:15px;line-height:1.5;padding:6px 10px;box-shadow:0 0 0 3px #000,4px 4px 0 3px rgba(0,0,0,.35);width:max-content;max-width:min(340px,72%);pointer-events:none;animation:pop .2s steps(3);z-index:5}
.say.below{position:relative;top:auto;transform:none;margin-top:14px;width:auto;max-width:none;animation:none}
.say.below::after{bottom:auto;top:-11px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.say::after{content:'';position:absolute;left:var(--tail,50%);bottom:-11px;width:12px;height:8px;background:#000;clip-path:polygon(0 0,100% 0,50% 100%)}
.lchange{display:inline-block;background:#000;color:var(--yellow);padding:4px 12px;margin-top:8px;animation:blink .4s steps(1) 4}
.lchange .light{margin-left:4px}
.lamp.was{opacity:.55;outline:2px dashed #000;outline-offset:2px}
.lamp.on{animation:lampIn .6s steps(3),blink 1s steps(1) .6s infinite}
@keyframes lampIn{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.quizbox .ct{font-size:18px;font-weight:bold}
.card.okc{background:var(--green)} .card.noc{background:var(--peach)}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:12px 4px}
.goal{background:var(--white);color:#000;border:none;font-family:inherit;font-size:16px;padding:12px;text-align:left;cursor:pointer;box-shadow:0 0 0 4px #000;display:flex;flex-direction:column;gap:4px}
.goal small{color:var(--dgray);font-size:14px;line-height:1.5}
.goal.sel{background:var(--yellow);box-shadow:0 0 0 4px #000,0 0 0 8px var(--orange)}
.goal:hover{filter:brightness(1.05)}
.gicon{font-size:30px;line-height:1}
.goal-res{display:flex;gap:12px;align-items:center;background:var(--lgray);padding:10px 12px;box-shadow:0 0 0 3px #000;margin:8px 4px}
.goal-res.ok{background:var(--yellow)}
.goal-tag{background:var(--yellow);color:#000;padding:0 6px}
.goal-tag:empty{display:none}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:10px 4px}
.badge{background:var(--lgray);color:var(--dgray);padding:10px;text-align:center;box-shadow:0 0 0 3px #000;display:flex;flex-direction:column;gap:2px}
.badge.got{background:var(--white);color:#000;box-shadow:0 0 0 3px #000,inset 0 0 0 3px var(--yellow)}
.badge .bicon{font-size:32px;line-height:1.2}
.badge small{font-size:12px;line-height:1.4}
.badge-pop{position:fixed;right:16px;top:64px;z-index:96;display:flex;gap:10px;align-items:center;background:var(--yellow);color:#000;padding:10px 16px;box-shadow:0 0 0 4px #000,6px 6px 0 4px rgba(0,0,0,.4);animation:pop .3s steps(3)}
.badge-pop .bicon{font-size:32px}
.code-share{background:var(--navy);color:var(--white);padding:8px 12px}
.code-share b{color:var(--yellow)}
/* 背景音樂開關 */
.music-btn{position:fixed;left:12px;bottom:12px;z-index:60;font-family:var(--font);font-size:15px;background:var(--yellow);color:#000;border:none;cursor:pointer;padding:6px 12px;box-shadow:0 0 0 3px #000,4px 4px 0 3px rgba(0,0,0,.4)}
.music-btn.off{background:var(--lgray);color:var(--dgray)}
.music-btn:active{transform:translateY(2px)}
.music-btn .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}
.music-btn .eq i{display:block;width:3px;background:#000;animation:eq .6s steps(3) infinite}
.music-btn .eq i:nth-child(2){animation-delay:.2s}.music-btn .eq i:nth-child(3){animation-delay:.4s}
.music-btn.off .eq i{animation:none;height:3px;background:var(--dgray)}
@keyframes eq{0%{height:3px}50%{height:12px}100%{height:6px}}

@media (max-width:600px){
  body{font-size:16px}
  #app{padding:10px 12px 40px}
  .title-logo{font-size:33px}
  .slider{grid-template-columns:96px 1fr 50px;gap:8px;margin:16px 0}
  .slider .amt{grid-column:2/4;text-align:left;margin-top:2px}
  input[type=range]{height:22px}
  input[type=range]::-webkit-slider-thumb{width:30px;height:36px}
  .headline{font-size:19px}
  .btn{padding:12px 16px}
  .btn.big{min-width:200px;font-size:18px}
  .grade{font-size:77px}
  .hud{gap:2px 10px;padding:6px 8px}
  .hud .stat{font-size:12px}
  table{font-size:13px}
  td,th{padding:4px 4px}
  .box{padding:14px 14px}
  .lamp{width:22px;height:22px} .lamp.on{width:34px;height:34px}
  .chart-cv{height:230px}
}
</style>
</head>
<body>
<div class="coins" id="coins"></div>
<button class="music-btn" id="musicBtn" onclick="BGM.toggle()" aria-label="背景音樂與音效開關"><span class="eq"><i></i><i></i><i></i></span><span id="musicTxt">聲音：開</span></button>
<div id="app">

<!-- ===== 開始畫面 ===== -->
<section id="s-title" class="screen center">
  <h1 class="title-logo pf">像素理財人生</h1>
  <div class="title-sub pf">FROM 18 TO 28</div>
  <div class="title-chars" id="titleChars"></div>
  <p style="margin-bottom:18px">從高三畢業開始的十年，你會怎麼用錢？</p>
  <div class="menu-col">
    <button class="btn big green" onclick="goCreate()">▶ 新遊戲</button>

const PAL = {K:'#000000', S:'#FFCCAA', E:'#000000', W:'#FFF1E8', B:'#1D2B53', F:'#FF77A8', R:'#FF004D', P:'#008751', C:'#FF77A8', Y:'#FFEC27', T:'#29ADFF'};
function spriteGrid(g, opt = {}) {

  else if (mood >= 30) { grid[8][7]='K'; grid[8][8]='K'; }
  else { grid[8][7]='K'; grid[8][8]='K'; grid[9][6]='K'; grid[9][9]='K'; grid[7][5]='T'; }
  // 大學背書包、上班打領帶、畢業戴方帽
  if (opt.phase === 'work') { grid[10][7]='R'; grid[10][8]='R'; grid[11][7]='R'; grid[11][8]='R'; grid[12][7]='R'; grid[12][8]='R'; }
  else if (opt.phase === 'college') { [10,11,12].forEach(y => { grid[y][5]='P'; grid[y][10]='P'; }); grid[11][1]='P'; grid[12][1]='P'; grid[11][14]='P'; grid[12][14]='P'; }
  else if (opt.phase === 'grad') { for (let x = 3; x <= 12; x++) grid[1][x] = 'K'; for (let x = 5; x <= 10; x++) grid[0][x] = 'K'; grid[2][12]='Y'; grid[3][12]='Y'; }

}
function paintGrid(ctx, grid, g, ox = 0, oy = 0) {

/* 場景：大學宿舍／上班族辦公室；窗外天氣跟著景氣燈號變 */
function drawScene(cv) {
  if (!cv || !S) return;
  const W = 128, H = 40; cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  const work = isWork(Math.max(S.year, 1)), L = S.light;
  R(0, 0, W, H, work ? '#C2C3C7' : '#83769C');
  R(0, 30, W, 10, work ? '#5F574F' : '#AB5236');
  for (let x = 0; x < W; x += 8) R(x, 30, 1, 10, 'rgba(0,0,0,.25)');
  R(0, 29, W, 1, '#000');
  // 窗戶：紅燈＝烈日、綠燈＝晴天、藍燈＝下雨
  const sky = ['#FFA300', '#FFCCAA', '#29ADFF', '#83769C', '#1D2B53'][L];
  R(50, 4, 28, 19, '#000'); R(52, 6, 24, 15, sky);
  if (L === 0) { R(66, 8, 6, 6, '#FF004D'); R(65, 9, 8, 4, '#FF004D'); }
  if (L === 1) { R(66, 8, 5, 5, '#FFEC27'); }
  if (L === 2) { R(67, 8, 4, 4, '#FFEC27'); R(54, 12, 8, 2, '#FFF1E8'); R(55, 11, 6, 1, '#FFF1E8'); }
  if (L === 3) { R(53, 9, 11, 3, '#C2C3C7'); R(62, 13, 11, 3, '#C2C3C7'); }
  if (L === 4) { R(52, 6, 24, 4, '#5F574F'); for (let i = 0; i < 8; i++) R(53 + i * 3, 11 + (i % 2) * 3, 1, 3, '#29ADFF'); }
  if (work) { R(52, 15, 4, 6, '#1D2B53'); R(57, 12, 5, 9, '#1D2B53'); R(68, 13, 6, 8, '#1D2B53'); R(58, 14, 1, 1, '#FFEC27'); R(70, 15, 1, 1, '#FFEC27'); }
  R(63, 6, 1, 15, '#000'); R(52, 13, 24, 1, '#000');
  if (!work) {
    // 上下舖、海報、書桌
    R(4, 9, 30, 2, '#5F574F'); R(4, 9, 2, 21, '#5F574F'); R(32, 9, 2, 21, '#5F574F');
    R(6, 11, 26, 3, '#FFF1E8'); R(6, 14, 26, 2, '#29ADFF'); R(7, 10, 5, 2, '#FFF1E8');
    R(4, 21, 30, 2, '#5F574F'); R(6, 23, 26, 3, '#FFF1E8'); R(6, 26, 26, 2, '#FF77A8');
    R(38, 7, 8, 11, '#000'); R(39, 8, 6, 9, '#FFEC27'); R(40, 10, 4, 4, '#FF004D');
    R(84, 20, 32, 2, '#AB5236'); R(86, 22, 2, 8, '#7E2553'); R(112, 22, 2, 8, '#7E2553');
    R(88, 13, 3, 7, '#1D2B53'); R(91, 14, 3, 6, '#FF004D'); R(94, 15, 3, 5, '#00E436');
    R(106, 11, 1, 9, '#000'); R(103, 10, 7, 2, '#FFEC27'); R(98, 19, 6, 1, '#FFF1E8');
  } else {
    // 辦公桌、螢幕上的走勢圖、盆栽、時鐘
    R(84, 20, 36, 2, '#000'); R(86, 22, 2, 8, '#000'); R(116, 22, 2, 8, '#000');
    R(92, 7, 20, 12, '#000'); R(93, 8, 18, 10, '#1D2B53'); R(101, 19, 2, 1, '#000');
    const up = L >= 3;
    for (let i = 0; i < 8; i++) R(94 + i * 2, up ? 16 - i : 10 + i % 3 + (i > 4 ? 3 : 0), 2, 1, up ? '#00E436' : '#FF004D');
    R(6, 22, 8, 8, '#AB5236'); R(7, 15, 6, 7, '#00E436'); R(5, 17, 3, 3, '#008751'); R(12, 16, 3, 3, '#008751');
    R(28, 6, 8, 8, '#000'); R(29, 7, 6, 6, '#FFF1E8'); R(32, 8, 1, 3, '#000'); R(32, 10, 2, 1, '#000');
  }
  // 可以點的東西：還沒點過的會閃一顆黃色小星星
  if (SC.frame % 6 < 3) sceneSpots(work).forEach(sp => { if (!SC.clicked[sp.id]) { R(sp.x + sp.w - 3, sp.y - 1, 3, 3, '#000'); R(sp.x + sp.w - 2, sp.y, 1, 1, '#FFEC27'); } });
  // 小人：會走路、轉身、跳
  let grid = spriteGrid(S.gender, {mood:S.happy, phase:work ? 'work' : 'college'});
  if (SC.dir < 0) grid = grid.map(r => r.slice().reverse());
  const walking = SC.x !== SC.tx && !SC.jump;

  paintGrid(c, grid, S.gender, SC.x, oy);
}

function goalProgress() {
  const g = goalOf(S); if (!g) return null;
  const t = total(), safeNeed = S.living * .75;

  if (g.id === 'travel') return `目標「${g.n}」：資產 ${money(t)} / $1,000,000，幸福值 ${S.happy} / 85。`;
  if (g.id === 'study')  return `目標「${g.n}」：現金＋債券 ${money(S.cash + S.bond)} / $500,000。`;
  if (g.id === 'safe')   return `目標「${g.n}」：現金 ${money(S.cash)} / ${money(safeNeed)}，保險 ${S.insuredYears} 年有保障。`;

}

function say(text, anchorX) {

  let b = wrap.querySelector('.say');
  if (!b) { b = document.createElement('div'); b.className = 'say'; wrap.appendChild(b); }

function placeSay() {
  const wrap = $('#sceneWrap'), b = wrap && wrap.querySelector('.say'); if (!b || !SC.say) return;
  const W = wrap.clientWidth;
  const ax = (SC.say.anchor === 'char' ? SC.x + 8 : SC.say.anchor) / 128 * W;

    return;
  }
  b.classList.remove('below');
  const bw = b.offsetWidth;
  const left = clamp(ax, bw / 2 + 6, W - bw / 2 - 6);
  b.style.left = left + 'px';
  b.style.setProperty('--tail', clamp(ax - (left - bw / 2) - 5, 8, bw - 18) + 'px');

function sceneHit(cv, e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 128, y = (e.clientY - r.top) / r.height * 40;
  if (x >= SC.x + 2 && x <= SC.x + 14 && y >= 12 && y <= 31) return {kind:'char'};
  const sp = sceneSpots(isWork(S.year)).find(s => x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h);
  return sp ? {kind:'spot', sp} : null;
}
function startScene() {
  const cv = $('#scene'); if (!cv || !S) return;
  cv.onclick = e => {
    const h = sceneHit(cv, e); if (!h) return;
    if (h.kind === 'char') {
      SC.jump = 1; SC.taps++; clearTimeout(SC.tapT); SC.tapT = setTimeout(() => SC.taps = 0, 1500);
      if (SC.taps >= 5) { SC.taps = 0; SC.dance = 16; say('🎉 跳一段理財舞！（不會增加資產喔）', 'char'); coinBurst(10); BGM.sfx('badge'); }
      else { say(charLine(), 'char'); BGM.sfx('coin'); }
    } else {
      SC.clicked[h.sp.id] = true;
      SC.dir = h.sp.x + h.sp.w / 2 > SC.x + 8 ? 1 : -1;
      say(spotLine(h.sp.id), h.sp.x + h.sp.w / 2); BGM.sfx('light');
    }
    drawScene(cv);
  };
  cv.onmousemove = e => { cv.style.cursor = sceneHit(cv, e) ? 'pointer' : 'default'; };

  SC.timer = setInterval(sceneTick, 120);

}
function sceneTick() {
  const cv = $('#scene');

  SC.frame++;
  if (SC.dance) { SC.dance--; if (SC.dance % 4 === 0) SC.jump = 1; }
  if (SC.jump) SC.jump = (SC.jump + 1) % JUMP.length;
  else if (SC.x !== SC.tx) { SC.dir = SC.tx > SC.x ? 1 : -1; SC.x += SC.dir; }
  else if (Math.random() < .025) { const [a, b] = isWork(S.year) ? [18, 76] : [36, 70]; SC.tx = Math.round(a + Math.random() * (b - a)); }

}

function modal(html, buttons = [{t:'關閉'}], opts = {}) {

/* 金額逐格跳動 */
function tick(el, from, to, opts = {}) {
  if (!el) return;
  const steps = 12; let i = 0;
  if (Math.round(from) === Math.round(to)) { el.textContent = money(to); return; }
  const d = to - from;
  const timer = setInterval(() => {
    i++; el.textContent = money(from + d * i / steps);
    if (i >= steps) {
      clearInterval(timer);
      if (opts.delta) el.insertAdjacentHTML('beforeend', `<span class="delta ${d >= 0 ? 'pos' : 'neg'}">${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))}</span>`);
    }
  }, 45);
}

/* =====================================================
   景氣代碼：同一個代碼 → 同一段十年（燈號、股票報酬、事件、抉擇卡、題目都一樣）
   班級對戰時全班輸入同一個代碼，比的是「決策」而不是運氣
===================================================== */
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function genWorld(code) {
  const R = mulberry32(Math.imul(parseInt(code, 10) || 1, 2654435761) >>> 0);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const w = {code:String(code), light:[2], u:[0], aux:[[]], ev:[null], card:{}, quiz:[], qOrder:[]};
  let L = 2;                                           // 第 1 年綠燈；之後 30% 轉熱、40% 不變、30% 轉冷
  for (let y = 1; y <= 10; y++) {
    if (y > 1) { const r = R(); if (r < .3) L = clamp(L - 1, 0, 4); else if (r >= .7) L = clamp(L + 1, 0, 4); }
    w.light[y] = L; w.u[y] = R(); w.aux[y] = [R(), R(), R(), R()];
  }
  let last = null;
  for (let y = 1; y <= 10; y++) { last = drawEvent(y, w.light[y], last, R); w.ev[y] = last; }
  const allIds = shuffle(CARDS.filter(c => c.phase === 'all').map(c => c.id));
  w.card[2] = allIds.pop(); w.card[4] = allIds.pop();
  const rest = shuffle(allIds.concat(CARDS.filter(c => c.phase === 'work').map(c => c.id)));
  [6, 8, 10].forEach(y => w.card[y] = rest.pop());
  w.quiz = shuffle(QBANK.map((_, i) => i)).slice(0, 10);
  w.qOrder = w.quiz.map(() => shuffle([0, 1, 2]));
  return w;
}

function onSlide(k, v, disp) { S.cur[k] = +v; updateAlloc(disp); }
function setAlloc(p, disp) { KEYS.forEach(k => { S.cur[k] = p[k]; $('#sl-' + k).value = p[k]; }); updateAlloc(disp); }
function updateAlloc(disp) {
  const sum = KEYS.reduce((s, k) => s + S.cur[k], 0), rem = 100 - sum;
  KEYS.forEach(k => { $('#p-' + k).textContent = S.cur[k] + '%'; $('#m-' + k).textContent = money(disp * S.cur[k] / 100); });
  $('#aBar').innerHTML = KEYS.map(k => `<span style="width:${S.cur[k] / Math.max(sum, 100) * 100}%;background:${KCOL[k]}"></span>`).join('');
  const t = $('#aRemain');
  t.textContent = rem === 0 ? '剩餘 0% ✔' : rem > 0 ? `剩餘 ${rem}%` : `超過 ${-rem}%`;
  t.classList.toggle('bad', rem !== 0);
  $('#btnSettle').disabled = rem !== 0;
}
function submitAlloc() {
  if (KEYS.reduce((s, k) => s + S.cur[k], 0) !== 100) { $('#aRemain').classList.add('shake'); return; }
  S.allocs.push({...S.cur});
  const log = {choice:null, evPick:null};
  const steps = [];
  if (S.year % 2 === 0) { const card = CARDS.find(c => c.id === S.world.card[S.year]); if (card) steps.push(next => showChoice(card, log, next)); }
  const ev = findEv(S.world.ev[S.year]);
  if (ev && ev.opts) steps.push(next => showEvChoice(ev, log, next));
  const run = () => steps.length ? steps.shift()(run) : settle(log);
  run();
}

/* =====================================================
   意外支出：現金 → 賣債券 → 賣股票（手續費＋ETF 證交稅）→ 刷卡變負債
===================================================== */
function pay(amount) {
  let rem = amount; const parts = [];
  const c = Math.min(Math.max(S.cash, 0), rem); if (c > 0) { S.cash -= c; rem -= c; parts.push(`現金 ${money(c)}`); }
  if (rem > 0.5 && S.bond > 0) {
    const gross = Math.min(S.bond, rem / (1 - FEE)); S.bond -= gross; S.fees += gross * FEE; S.investOut += gross * (1 - FEE); rem -= gross * (1 - FEE);
    parts.push(`賣債券 ${money(gross)}`);
  }
  if (rem > 0.5 && S.stock > 0) {
    const k = 1 - FEE - ETF_TAX, gross = Math.min(S.stock, rem / k);
    S.stock -= gross; S.fees += gross * (FEE + ETF_TAX); S.investOut += gross * k; rem -= gross * k;
    parts.push(`賣股票 ETF ${money(gross)}（扣手續費與證交稅）`);
  }
  if (rem > 0.5) { S.debt += rem; parts.push(`<span class="neg">刷卡變負債 ${money(rem)}</span>`); }
  return '付款方式：' + parts.join(' → ');
}

function drawEvent(y, light, last, R) {
  const table = isWork(y) ? EV_W.concat(EV_WI) : EV_C.concat(EV_CI);
  const cold = light >= 3;                        // 藍燈、黃藍燈：失業機率加倍，多的從「平安的一年」扣
  const unempExtra = cold ? table.filter(e => e.unemp).reduce((s, e) => s + e.p, 0) : 0;
  const pool = table.filter(e => e.id !== last);
  const wts = pool.map(e => e.unemp && cold ? e.p * 2 : e.safe ? Math.max(0, e.p - unempExtra) : e.p);
  let r = R() * wts.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= wts[i]; if (r <= 0) return pool[i].id; }
  return pool[pool.length - 1].id;
}
const findEv = id => EV_C.concat(EV_CI, EV_W, EV_WI).find(e => e.id === id);

/* =====================================================
   年度結算（第四節結算順序）
   分配入帳 → 利息與報酬 → 隨機事件 → 負債加利息、現金自動還債 → 幸福值 → 加薪與通膨
===================================================== */
function settle(log) {
  const y = S.year, L = LIGHTS[S.light], a = S.allocs[S.allocs.length - 1];
  const {inc, liv} = incomeOf(y), disp = inc - liv;
  const amt = {}; KEYS.forEach(k => amt[k] = disp * a[k] / 100);
  const prev = {cash:S.cash, bond:S.bond, stock:S.stock, debt:S.debt, happy:S.happy};

  // 1. 分配入帳
  S.cash += amt.dep;
  const buyFee = (amt.bond + amt.stk) * FEE;
  S.bond += amt.bond * (1 - FEE); S.stock += amt.stk * (1 - FEE); S.fees += buyFee;
  S.investIn += amt.bond + amt.stk;
  const insured = a.ins > 0 && amt.ins >= disp * .05 - 0.5;
  if (insured) S.insuredYears++;

  // 2. 定存利息、債券與股票報酬
  if (S.debt > 0.5) S.everDebt = true;
  const rS = L.stk[0] + S.world.u[y] * (L.stk[1] - L.stk[0]) + S.holdBonus; const bonusUsed = S.holdBonus; S.holdBonus = 0;
  const margin = S.marginYear;
  let marginTxt = '';
  const base = Math.max(S.cash, 0) + S.bond + S.stock;
  const gC = Math.max(S.cash, 0) * L.dep, gB = S.bond * L.bond;
  let gS;
  S.cash += gC; S.bond += gB;
  if (margin) {
    const pos = S.stock, interest = pos * 1.5 * .06;
    gS = pos * rS * 2.5;
    if (pos + gS <= 0) { gS = -pos; marginTxt = `融資：股市 ${pct(rS)} × 2.5 倍，股票部位賠光，被${tm('斷頭')}歸零！`; unlock('margin'); }
    else marginTxt = `融資：股市 ${pct(rS)} × 2.5 倍＝${pct(rS * 2.5)}。`;
    S.stock = pos + gS;
    const p = interest > 0.5 ? pay(interest) : '';
    marginTxt += ` 融資利息 ${money(interest)}（股票部位 × 1.5 × 6%）。${p ? `<br><span class="muted">${p}</span>` : ''}`;
  } else {
    gS = S.stock * rS;
    S.stock += gS;
  }
  const rP = base > 0 ? (gC + gB + gS) / base : 0;

  // 3. 隨機事件
  const ev = findEv(S.world.ev[y]);
  const pickI = ev.opts ? (log.evPick ?? 1) : null;
  const r = ev.opts ? ev.opts[pickI].fn(insured, S.world.aux[y][2]) : ev.fn(insured);
  let payTxt = '';
  if (r.cost) payTxt = pay(r.cost);
  if (r.gain) S.cash += r.gain;
  if (ev.sick) { if (insured) { S.sickIns++; unlock('insured'); } else S.sickNoIns++; }
  if (ev.id === 'c4' || ev.id === 'w8') unlock('lemon');
  const evOut = {ev, pick:pickI !== null ? ev.opts[pickI].t : null, txt:r.txt, pay:payTxt, gain:r.gain || 0, cost:r.cost || 0, dh:r.dh || 0, lsn:r.lsn};

  // 4. 負債加利息、用現金自動還債
  let debtInt = 0, repaid = 0;
  if (S.debt > 0.5) {
    debtInt = S.debt * CARD_RATE; S.debt += debtInt;
    repaid = Math.min(Math.max(S.cash, 0), S.debt); S.cash -= repaid; S.debt -= repaid;
    if (S.debt < 0.5) S.debt = 0;
  }

  // 5. 幸福值：享樂比例＋事件＋負債
  const f = a.fun, dhFun = f < 10 ? -8 : f < 20 ? -3 : f < 35 ? 3 : 6;
  const dhDebt = S.debt > 0.5 ? -5 : 0;
  if (S.debt > 0.5) S.everDebt = true;
  // 快問快答獎勵
  let quizOut = null;
  if (S.qPending) { quizOut = S.qPending; S.quizLog.push({y, ...quizOut}); if (quizOut.right) S.cash += 2000; S.qPending = null; }
  const dhQuiz = quizOut && quizOut.right ? 2 : 0;
  S.happy = clamp(Math.round(S.happy + dhFun + evOut.dh + dhDebt + dhQuiz), 0, 100);
  if (S.happy >= 100) unlock('happy');

  // 6. 加薪與通膨（下一年生效）
  const livOld = S.living;
  S.living *= 1 + L.cpi;
  if (isWork(y)) S.salary *= 1.03;
  S.cpiIdx *= 1 + L.cpi;
  if (S.bond > 1 && S.stock > 1) S.bothYears++;

/* =====================================================
   像素折線圖（<canvas> 自己畫）
===================================================== */
function drawChart(cv) {
  if (!S || !cv) return;
  const data = S.hist;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 600, H = cv.clientHeight || 270;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
  const padL = 52, padR = 14, padT = 22, padB = 48;
  const hasDebt = data.some(d => d.debt > 0.5);
  const series = [
    {k:'cash',  n:'現金',     c:'#00E436', w:3},
    {k:'bond',  n:'債券',     c:'#83769C', w:3},
    {k:'stock', n:'股票 ETF', c:'#FFEC27', w:3},
    {k:'total', n:'總資產',   c:'#FFF1E8', w:5}
  ];
  if (hasDebt) series.push({k:'debt', n:'負債', c:'#FF004D', w:3});
  const vals = data.flatMap(d => series.map(s => d[s.k]));
  let max = Math.max(50000, ...vals), min = Math.min(0, ...vals);
  const stepV = niceStep((max - min) / 4); max = Math.ceil(max / stepV) * stepV; min = Math.floor(min / stepV) * stepV;
  const X = i => Math.round(padL + (W - padL - padR) * i / 10);
  const Y = v => Math.round(padT + (H - padT - padB) * (1 - (v - min) / (max - min)));
  ctx.fillStyle = '#10183a'; ctx.fillRect(0, 0, W, H);
  ctx.font = "13px Cubic11, 'Noto Sans TC', sans-serif"; ctx.textBaseline = 'middle';
  for (let v = min; v <= max + 1; v += stepV) {
    const yy = Y(v);
    ctx.fillStyle = 'rgba(255,255,255,.14)'; for (let x = padL; x < W - padR; x += 6) ctx.fillRect(x, yy, 3, 2);
    ctx.fillStyle = '#C2C3C7'; ctx.textAlign = 'right'; ctx.fillText(v === 0 ? '0' : (v / 10000) + '萬', padL - 6, yy);
  }
  // 畢業虛線（大學 4 年與上班之間）
  const gx = X(4);
  ctx.fillStyle = '#FF77A8';
  for (let yy = padT; yy < H - padB; yy += 8) ctx.fillRect(gx - 1, yy, 2, 4);
  ctx.textAlign = 'center'; ctx.fillText('畢業', gx, padT - 10);
  // X 軸：年齡，下方標出當年燈號顏色
  for (let i = 0; i <= 10; i++) {
    ctx.fillStyle = '#C2C3C7'; ctx.fillText(18 + i, X(i), H - padB + 12);
    const li = data[i] ? data[i].light : null;
    if (li !== null && li !== undefined) {
      const c = LIGHTS[li].c;
      ctx.fillStyle = '#000'; ctx.fillRect(X(i) - 7, H - padB + 22, 14, 14);
      ctx.fillStyle = c[0]; ctx.fillRect(X(i) - 5, H - padB + 24, 10, 5);
      ctx.fillStyle = c[1]; ctx.fillRect(X(i) - 5, H - padB + 29, 10, 5);
    }
  }
  // 方塊組成的像素線
  series.forEach(s => {
    ctx.fillStyle = s.c;
    for (let i = 1; i < data.length; i++) pixLine(ctx, X(i - 1), Y(data[i - 1][s.k]), X(i), Y(data[i][s.k]), s.w);
  });
  series.forEach(s => data.forEach((d, i) => { ctx.fillStyle = '#000'; ctx.fillRect(X(i) - 5, Y(d[s.k]) - 5, 10, 10); ctx.fillStyle = s.c; ctx.fillRect(X(i) - 3, Y(d[s.k]) - 3, 6, 6); }));
  const lg = cv.parentElement.querySelector('.legend');
  if (lg) lg.innerHTML = series.map(s => `<span><i style="background:${s.c}"></i>${s.n}</span>`).join('') + '<span class="muted">X 軸是年齡；下方小方塊是那一年的景氣燈號</span>';
}
function pixLine(ctx, x0, y0, x1, y1, w) {
  const dx = x1 - x0, dy = y1 - y0, n = Math.max(1, Math.round(Math.max(Math.abs(dx), Math.abs(dy)) / 2));
  for (let i = 0; i <= n; i++) {
    const x = Math.round((x0 + dx * i / n) / 2) * 2, y = Math.round((y0 + dy * i / n) / 2) * 2;
    ctx.fillRect(x - (w >> 1), y - (w >> 1), w, w);
  }
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))); const m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => document.querySelectorAll('section.screen:not(.hidden) canvas.chart-cv').forEach(drawChart), 150); });

const GRADE_CUT = {S:290, A:260, B:230, C:190};   // v0.7：加入快問快答、人生目標後重新模擬調整
function computeEnding(st = S) {
  const tot = total(st), b = [];
  if (st.cash >= st.living / 2) b.push(['結局現金 ≥ 6 個月必要生活費（有緊急預備金）', 20]);
  if (st.insuredYears >= 10) b.push(['10 年都有保險保障', 10]);
  if (st.bothYears >= 7) b.push([`${st.bothYears} 年同時投資債券與股票（有分散）`, 10]);
  if (st.good) b.push([`抉擇卡選到較佳選項 ${st.good} 張`, st.good * 5]);
  const gl = goalOf(st); if (gl && gl.ok(st)) b.push([`達成人生目標：${gl.i} ${gl.n}`, GOAL_BONUS]);
  if (st.debt > 0.5) b.push(['結局仍有負債', -30]);
  if (st.happy < 30) b.push(['結局幸福值低於 30（生活太苦）', -20]);
  const base = Math.round(tot / 10000);
  const score = base + st.happy + b.reduce((s, x) => s + x[1], 0);
  const grade = score >= GRADE_CUT.S ? 'S' : score >= GRADE_CUT.A ? 'A' : score >= GRADE_CUT.B ? 'B' : score >= GRADE_CUT.C ? 'C' : 'D';
  return {tot, base, b, score, grade};
}
const avg = (arr, f) => arr.length ? arr.reduce((s, x) => s + f(x), 0) / arr.length : 0;

  const c0 = c;
  for (let k = 0; k < 37; k++) { bal = bal * (1 + r) + c; c *= 1.03; }
  return {bal, c0, r, ratio};
}

}

/* 存檔只記錄到「最後一個已結算的年度」，讀檔後從下一年的景氣新聞接著玩 */
function snap() {
  const s = JSON.parse(JSON.stringify(S));
  if (s.hist.length - 1 < s.year) {
    s.year -= 1;
    s.light = s.hist[s.hist.length - 1].light;
    s.lightHist = s.lightHist.slice(0, s.year + 1);
    s.usedCards = s.usedCards.slice(0, s.choices.length);
    s.allocs = s.allocs.slice(0, s.year);
    if (s.year < 5) s.living = s.hist.length > 1 ? s.living : 108000;
  }
  s.cur = null; s.marginYear = false; s.qPending = null;
  s.evPicks = (s.evPicks || []).filter(e => e.y <= s.year);
  return s;
}
function saveTo(i) {
  const slots = getSlots();
  const st = snap(); st.slot = i;
  slots[i] = {t:new Date().toLocaleString('zh-TW', {hour12:false}), s:st};
  S.slot = i;
  return setSlots(slots);
}
function autoSave(then, quiet) {
  if (!STORE_OK) { if (!quiet) toast('這台瀏覽器無法存檔，請改用存檔碼'); return then(); }
  const slots = getSlots();
  if (S.slot !== null && S.slot !== undefined) { saveTo(S.slot); if (!quiet) flashSaved(); return then(); }
  const empty = slots.findIndex(x => !x);
  if (empty >= 0) { saveTo(empty); if (!quiet) flashSaved(`已存檔到欄位 ${empty + 1}`); return then(); }
  chooseSlot('三個存檔欄位都滿了，要覆蓋哪一格？', i => { saveTo(i); flashSaved(); then(); }, then);
}
function chooseSlot(msg, onPick, onSkip) {
  const slots = getSlots();
  const html = `<h2>選擇存檔欄位</h2><p>${msg}</p>` + slots.map((x, i) => `<div class="slot ${x ? '' : 'empty'}"><div class="info"><b>欄位 ${i + 1}</b>${x && x.s.finished ? '<span class="tag">已完成</span>' : ''}<br>${x ? slotSummary(x.s) + `<br><span class="muted">${esc(x.t)}</span>` : '（空）'}</div><button class="btn small" data-i="${i}">存到這裡</button></div>`).join('');
  const bg = modal(html, [{t:onSkip ? '不存檔，繼續' : '取消', cls:'gray', fn:onSkip}], {locked:!!onSkip});
  bg.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {

    if (slots[i] && i !== S.slot) confirmBox(`欄位 ${i + 1} 已經有「${esc(slots[i].s.name)}」的存檔，確定覆蓋？`, go, '覆蓋');
    else go();
  });
}

/* 存檔碼：PXL1. + Base64(JSON) + . + 檢查碼 */
function checksum(str) { let h = 7; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h.toString(36); }
function toCode(st) {
  const s = {...st}; delete s.slot;
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(s))));
  return 'PXL1.' + b + '.' + checksum(b);
}
function fromCode(code) {
  try {
    const c = String(code).replace(/\s+/g, '');
    const m = c.match(/^PXL1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/); if (!m) return null;
    if (checksum(m[1]) !== m[2]) return null;
    const st = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    const need = ['name', 'gender', 'risk', 'year', 'light', 'cash', 'bond', 'stock', 'debt', 'happy', 'hist', 'allocs', 'lightHist', 'usedCards'];
    if (!st || !need.every(k => k in st) || !Array.isArray(st.hist) || st.year < 0 || st.year > 10) return null;
    st.slot = null; return st;
  } catch (e) { return null; }
}
function exportCode(st) {
  const code = toCode(st);
  modal(`<h2>🔑 存檔碼</h2><p>把這串文字複製起來（例如貼到自己的 LINE 或筆記），到別台電腦按「繼續遊戲 → 匯入存檔碼」就能接著玩。</p>
    <textarea id="codeBox" readonly>${code}</textarea>`, [{t:'複製', cls:'green', keep:true, fn:() => {
      const ta = $('#codeBox'); ta.select();
      const ok = () => toast('已複製存檔碼'), fail = () => { try { document.execCommand('copy'); ok(); } catch (e) { toast('請手動選取文字複製'); } };
      navigator.clipboard ? navigator.clipboard.writeText(code).then(ok, fail) : fail();
    }}, {t:'關閉', cls:'gray'}]);
  setTimeout(() => { const t = $('#codeBox'); t && t.select(); }, 50);
}
function importCode() {
  const st = fromCode($('#importBox').value);
  if (!st) { $('#importErr').textContent = '存檔碼無法辨識'; return; }
  resume(st);

}

      <tr><td>15</td><td>收支、預備金、信用、保險、退休</td><td>分配機制、卡債、退休試算</td></tr>
      <tr><td>16</td><td>心理偏誤、詐騙</td><td>抉擇卡：詐騙群組、假簡訊、大跌要不要賣</td></tr>
    </table></div>
    <p class="muted mt">報酬率與事件都是教學用的簡化設定，不代表真實市場，也不構成投資建議。</p>
    <div class="row mt"><button class="btn" onclick="show('${back}')">◀ 返回</button></div>
  </div>`;
}

/* =====================================================
   背景音樂：用 Web Audio API 即時合成 8-bit 風格旋律（不用額外音樂檔）
   C 大調、128 BPM，和弦 C → Am → F → G，8 小節循環
===================================================== */
const BGM = (() => {
  const BPM = 128, STEP = 60 / BPM / 2;           // 一格＝八分音符
  const C5 = 72;
  // 主旋律（MIDI 音高，0＝休止），每小節 8 格
  const MEL = [
    76,79,84,79, 76,79,81,79,   // C
    76, 0,72,76, 81, 0,79,76,   // Am
    77,81,84,81, 77,81,79,77,   // F
    74, 0,79, 0, 71,74,79, 0,   // G
    76,79,84,86, 88, 0,86,84,   // C
    81, 0,76, 0, 81,84,83,81,   // Am
    77, 0,81,84, 81, 0,79,77,   // F
    79, 0,83,86, 84, 0, 0, 0    // G → C
  ];
  // 低音（每拍一個音：根音、五度交替）
  const ROOT = [48, 45, 41, 43, 48, 45, 41, 43];   // C Am F G
  // 和弦琶音（三和弦，小聲墊底）
  const CHORD = [[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
  let ctx = null, master = null, noise = null, timer = null, step = 0, nextT = 0;
  let on = (() => { try { return localStorage.getItem('pxlife_bgm') !== 'off'; } catch (e) { return true; } })();
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(type, m, t, dur, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(hz(m), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function hat(t, vol) {
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise; f.type = 'highpass'; f.frequency.value = 6000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + 0.06);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
  }
  function schedule() {
    while (nextT < ctx.currentTime + 0.15) {
      const i = step % 64, bar = Math.floor(i / 8), beat = i % 8;
      const m = MEL[i];
      if (m) tone('square', m, nextT, STEP * 0.85, 0.11);
      if (beat % 2 === 0) tone('triangle', ROOT[bar] + (beat % 4 === 2 ? 7 : 0), nextT, STEP * 1.7, 0.32);
      const ch = CHORD[bar % 4];
      tone('square', ch[beat % 3] , nextT, STEP * 0.5, 0.025);
      if (beat === 0 || beat === 4) kick(nextT);
      if (beat % 2 === 1) hat(nextT, 0.12);
      nextT += STEP; step++;
    }
  }
  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.18; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function start() {
    if (!init()) return;
    ctx.resume();
    if (timer) return;
    nextT = ctx.currentTime + 0.06;
    timer = setInterval(schedule, 25);
  }
  function stop() { clearInterval(timer); timer = null; if (ctx) ctx.suspend(); }
  // 音效：拿錢、扣錢、升級、徽章、答對、答錯、按鈕、燈號變化
  const SFX = {
    coin:[[88,.06],[95,.14]], lose:[[67,.1],[63,.1],[58,.2]], up:[[72,.08],[76,.08],[79,.08],[84,.24]],
    badge:[[79,.07],[84,.07],[88,.07],[91,.07],[96,.28]], right:[[84,.08],[91,.18]], wrong:[[55,.12],[50,.26]],
    click:[[90,.025]], light:[[67,.05],[74,.05],[79,.08]]
  };
  function sfx(name) {
    if (!on || !SFX[name] || !init()) return;
    if (ctx.state === 'suspended') ctx.resume();
    let t = ctx.currentTime + 0.01;
    SFX[name].forEach(([m, d]) => { tone(name === 'lose' || name === 'wrong' ? 'sawtooth' : 'square', m, t, d + 0.05, name === 'click' ? 0.05 : 0.14); t += d; });
  }
  function ui() {
    $('#musicBtn').classList.toggle('off', !on);
    $('#musicTxt').textContent = on ? '聲音：開' : '聲音：關';
  }
  function toggle() {
    if (on && !timer) { start(); ui(); return; }   // 還沒開始播：第一次按就是播放
    on = !on;
    try { localStorage.setItem('pxlife_bgm', on ? 'on' : 'off'); } catch (e) {}
    on ? start() : stop(); ui();
  }
  // 瀏覽器規定：使用者第一次點擊後才能播放聲音
  function firstGesture(e) {
    if (e.target.closest && e.target.closest('#musicBtn')) return;
    if (on) start();
    window.removeEventListener('pointerdown', firstGesture, true);
    window.removeEventListener('keydown', firstGesture, true);
  }
  window.addEventListener('pointerdown', firstGesture, true);
  window.addEventListener('keydown', firstGesture, true);
  document.addEventListener('visibilitychange', () => { if (!ctx || !on) return; document.hidden ? ctx.suspend() : ctx.resume(); });
  document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('.btn,.goal,.mcard,.gcard')) sfx('click'); }, true);
  return {toggle, ui, sfx, get playing() { return !!timer; }};
})();

/* 啟動 */
BGM.ui();
show('s-title');
</script>
